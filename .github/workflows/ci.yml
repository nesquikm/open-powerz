name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies (Tauri, hidapi, serialport)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libudev-dev libusb-1.0-0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: JS install
        run: bun install --frozen-lockfile

      - name: JS lint, typecheck, test, build
        run: |
          bun run lint
          bun run check
          bun run test
          bun run build:web

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust test
        run: cargo test --workspace --locked

      - name: Rust docs
        run: cargo doc -p powerz-protocol --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
