name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Linux system dependencies (Tauri, hidapi, serialport)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libudev-dev libusb-1.0-0-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: JS install
        run: bun install --frozen-lockfile

      - name: JS lint, typecheck, test, build
        run: |
          bun run lint
          bun run check
          bun run test
          bun run build:web

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust test
        run: cargo test --workspace --locked

      # The `e2e` Cargo feature (FR AH2AEN) only builds in the e2e-app job otherwise: lint it
      # and run its unit and save-path tests here on every OS, macOS included.
      - name: Rust lint and test (e2e feature)
        run: |
          cargo clippy -p open-powerz-desktop --all-targets --features e2e --locked -- -D warnings
          cargo test -p open-powerz-desktop --features e2e --locked --lib --test e2e_save

      # Timing bounds only mean something in an optimized build (1 M-row export ≤ 5 s).
      - name: Rust release-mode timing tests
        run: cargo test --release -p open-powerz-desktop --locked --test recording --test history

      - name: Rust docs
        run: cargo doc -p powerz-protocol --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # Desktop end-to-end suites, separate from the gate. Both jobs are plain required jobs
  # (no continue-on-error): list them as required checks in branch protection.
  #
  # Real-app suite (WebdriverIO + tauri-driver): Linux and Windows only, because
  # tauri-driver has no macOS support (WKWebView has no WebDriver).
  e2e-app:
    name: e2e-app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TAURI_DRIVER_VERSION: 2.0.6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Linux system dependencies (Tauri, WebKitGTK WebDriver, xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libudev-dev libusb-1.0-0-dev webkit2gtk-driver xvfb

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: e2e

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: JS install
        run: bun install --frozen-lockfile

      - name: Install tauri-driver
        run: cargo install tauri-driver --version "$TAURI_DRIVER_VERSION" --locked
        shell: bash

      # The Edge WebDriver must match the WebView2 runtime the app runs in, so download the
      # msedgedriver whose version equals the installed WebView2 (falling back to Edge). When
      # that exact build is not published, take the newest driver of the same major version
      # (LATEST_RELEASE_<major>_WINDOWS on the same host). HTTPS and Microsoft's host only, with
      # retries; the driver must carry a valid Authenticode signature by Microsoft.
      - name: Edge WebDriver matching WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hostUrl = 'https://msedgedriver.microsoft.com'
          $retry = @{ MaximumRetryCount = 3; RetryIntervalSec = 5 }
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).pv
          if (-not $version) {
            $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
            $version = (Get-Item $edge).VersionInfo.ProductVersion
          }
          Write-Host "WebView2 / Edge version: $version"
          $dir = Join-Path $env:RUNNER_TEMP 'msedgedriver'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $dir 'edgedriver_win64.zip'
          try {
            Invoke-WebRequest @retry -Uri "$hostUrl/$version/edgedriver_win64.zip" -OutFile $zip
          } catch {
            $status = $_.Exception.Response.StatusCode.value__
            if ($status -ne 404) { throw }
            $major = $version.Split('.')[0]
            $latestFile = Join-Path $dir 'LATEST_RELEASE'
            Invoke-WebRequest @retry -Uri "$hostUrl/LATEST_RELEASE_${major}_WINDOWS" -OutFile $latestFile
            $latest = (Get-Content -Path $latestFile -Raw).Trim()
            if ($latest -notmatch '^\d+(\.\d+){3}$') { throw "unexpected LATEST_RELEASE_${major}_WINDOWS: '$latest'" }
            Write-Host "msedgedriver $version is not published (404); using $latest"
            Invoke-WebRequest @retry -Uri "$hostUrl/$latest/edgedriver_win64.zip" -OutFile $zip
          }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $driver = Join-Path $dir 'msedgedriver.exe'
          $sig = Get-AuthenticodeSignature -FilePath $driver
          $signer = $sig.SignerCertificate.Subject
          Write-Host "msedgedriver.exe signature: $($sig.Status), signer: $signer"
          if ($sig.Status -ne 'Valid' -or $signer -notmatch '(^|,\s*)O=Microsoft Corporation(,|$)') {
            throw "msedgedriver.exe is not validly signed by Microsoft ($($sig.Status), '$signer')"
          }
          & $driver --version
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      - name: Real-app e2e (Linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum bun run e2e:app

      - name: Real-app e2e (Windows)
        if: runner.os == 'Windows'
        run: bun run e2e:app

      # wdio writes its own and tauri-driver's logs to apps/desktop/e2e-app-logs/ (wdio.conf.ts).
      - name: Upload WebdriverIO and tauri-driver logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-app-logs-${{ matrix.os }}
          path: apps/desktop/e2e-app-logs/
          if-no-files-found: ignore
          retention-days: 14

  # UI suite (Playwright): the mock-backend web build in Playwright's bundled Chromium and
  # WebKit on all three OSes. No Rust needed; the config builds and serves the web UI.
  e2e-ui:
    name: e2e-ui (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: JS install
        run: bun install --frozen-lockfile

      # Linux needs the browsers' system libraries too (--with-deps); macOS and Windows do not.
      - name: Playwright browsers
        working-directory: apps/desktop
        run: bunx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium webkit

      - name: UI e2e
        run: bun run e2e:ui

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            apps/desktop/playwright-report/
            apps/desktop/e2e/ui/playwright-report/
            apps/desktop/e2e/ui/test-results/
            apps/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 14
