name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Linux system dependencies (Tauri, hidapi, serialport)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libudev-dev libusb-1.0-0-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: JS install
        run: bun install --frozen-lockfile

      - name: JS lint, typecheck, test, build
        run: |
          bun run lint
          bun run check
          bun run test
          bun run build:web

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust test
        run: cargo test --workspace --locked

      # Timing bounds only mean something in an optimized build (1 M-row export ≤ 5 s).
      - name: Rust release-mode timing tests
        run: cargo test --release -p open-powerz-desktop --locked --test recording

      - name: Rust docs
        run: cargo doc -p powerz-protocol --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
