name: Release

on:
  push:
    tags: ["v*"]
  # A PR run is a dry run: check, desktop, cli and assemble run; publish is skipped and the files land in the release-files artifact.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "apps/desktop/scripts/release/**"
      - "apps/desktop/src-tauri/tauri.conf.json"
      - "rust-toolchain.toml"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (e.g. v0.6.0)
        required: true
        type: string

permissions:
  contents: read

# bash on every runner (Windows too): errexit + pipefail, so any failing command fails its step.
defaults:
  run:
    shell: bash

# One group per tag, so a tag push and a manual run for the same tag never publish at once.
concurrency:
  group: release-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.versions.outputs.tag }}
      version: ${{ steps.versions.outputs.version }}
      prerelease: ${{ steps.versions.outputs.prerelease }}
      title: ${{ steps.versions.outputs.title }}
    steps:
      # The scripts always come from this workflow's commit. A manual run checks the tag
      # out beside them, so a tag cut before the release scripts existed still works.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'workflow_dispatch'
        with:
          persist-credentials: false
          path: release-src
          ref: ${{ format('refs/tags/{0}', inputs.tag) }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # Fails the run before any build when the tag and the release files disagree.
      # A pull request has no tag, so it checks the files against the Cargo version.
      - name: Check versions and extract the release notes
        id: versions
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          SRC=.
          case "$EVENT_NAME" in
            pull_request) TAG=--from-cargo ;;
            workflow_dispatch) TAG="$INPUT_TAG" SRC=release-src ;;
            *) TAG="$REF_NAME" ;;
          esac
          bun apps/desktop/scripts/release/versions.ts "$TAG" --root "$SRC" --notes "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"

      # The tagged version's CHANGELOG section, for the publish job.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 14

  # Unsigned desktop bundles (no Apple, Windows or updater signing). tauri-action only
  # builds here; the publish job attaches the files to the release.
  desktop:
    name: desktop (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            targets: aarch64-apple-darwin x86_64-apple-darwin
          # WiX (.msi) only takes a numeric version, so a pre-release tag builds the NSIS .exe alone.
          - os: windows-latest
            args: --bundles msi,nsis
            prerelease_args: --bundles nsis
          - os: ubuntu-22.04
            args: --bundles appimage,deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event_name != 'pull_request' && format('refs/tags/{0}', needs.check.outputs.tag) || '' }}

      # A manual run can build a tag cut before rust-toolchain.toml existed: use this workflow's pin then.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'workflow_dispatch'
        with:
          persist-credentials: false
          path: .release-tools
          sparse-checkout: rust-toolchain.toml
          sparse-checkout-cone-mode: false

      - name: Toolchain pin for older tags
        if: github.event_name == 'workflow_dispatch'
        run: |
          [ -f rust-toolchain.toml ] || cp .release-tools/rust-toolchain.toml .

      - name: Linux system dependencies (Tauri, hidapi, serialport)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libudev-dev libusb-1.0-0-dev

      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version

      - name: Rust targets (macOS universal)
        if: matrix.targets
        env:
          TARGETS: ${{ matrix.targets }}
        run: rustup target add $TARGETS

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: JS install
        run: bun install --frozen-lockfile

      - name: Build the desktop app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          args: ${{ needs.check.outputs.prerelease == 'true' && matrix.prerelease_args || matrix.args }}

      - name: Collect the bundles
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          found=0
          # find, not a globstar glob: macOS ships bash 3.2, which has no globstar.
          while IFS= read -r f; do
            cp "$f" "$RUNNER_TEMP/dist/"
            echo "bundle: $f"
            found=$((found + 1))
          done < <(find target -path '*/release/bundle/*' -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.AppImage' -o -name '*.deb' \))
          if [ "$found" -eq 0 ]; then
            echo "no desktop bundles found under target/" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 14

  # The `powerz` CLI as a release binary per OS, packed with the LICENSE and README.
  cli:
    name: cli (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-universal
            targets: aarch64-apple-darwin x86_64-apple-darwin
          - os: windows-latest
            platform: windows-x86_64
            targets: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            platform: linux-x86_64
            targets: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event_name != 'pull_request' && format('refs/tags/{0}', needs.check.outputs.tag) || '' }}

      # A manual run can build a tag cut before rust-toolchain.toml existed: use this workflow's pin then.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'workflow_dispatch'
        with:
          persist-credentials: false
          path: .release-tools
          sparse-checkout: rust-toolchain.toml
          sparse-checkout-cone-mode: false

      - name: Toolchain pin for older tags
        if: github.event_name == 'workflow_dispatch'
        run: |
          [ -f rust-toolchain.toml ] || cp .release-tools/rust-toolchain.toml .

      - name: Linux system dependencies (hidapi, serialport)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libusb-1.0-0-dev

      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version

      - name: Rust targets
        env:
          TARGETS: ${{ matrix.targets }}
        run: rustup target add $TARGETS

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-cli

      - name: Build and pack the CLI
        env:
          VERSION: ${{ needs.check.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          TARGETS: ${{ matrix.targets }}
        run: |
          for t in $TARGETS; do
            cargo build --release -p powerz-cli --locked --target "$t"
          done
          stage="powerz-$VERSION-$PLATFORM"
          mkdir -p "$stage" "$RUNNER_TEMP/dist"
          cp LICENSE README.md "$stage/"
          case "$PLATFORM" in
            macos-universal)
              lipo -create -output "$stage/powerz" \
                target/aarch64-apple-darwin/release/powerz \
                target/x86_64-apple-darwin/release/powerz
              lipo -info "$stage/powerz"
              tar -czf "$RUNNER_TEMP/dist/powerz-$VERSION-macos-universal.tar.gz" "$stage"
              ;;
            linux-x86_64)
              cp target/x86_64-unknown-linux-gnu/release/powerz "$stage/"
              tar -czf "$RUNNER_TEMP/dist/powerz-$VERSION-linux-x86_64.tar.gz" "$stage"
              ;;
            windows-x86_64)
              cp target/x86_64-pc-windows-msvc/release/powerz.exe "$stage/"
              7z a "$RUNNER_TEMP/dist/powerz-$VERSION-windows-x86_64.zip" "$stage"
              ;;
            *)
              echo "unknown platform: $PLATFORM" >&2
              exit 1
              ;;
          esac
          ls -l "$RUNNER_TEMP/dist"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-${{ matrix.os }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 14

  # Gathers every desktop bundle and CLI archive into one set of release files and
  # adds a SHA256SUMS.txt covering all of them. Read-only: it never touches the release.
  assemble:
    name: assemble
    needs: [check, desktop, cli]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "{desktop,cli}-*"
          merge-multiple: true
          path: ${{ runner.temp }}/dist

      # Every build leg must have delivered its files: a leg that uploads fewer files
      # than expected stops here instead of publishing an incomplete release.
      - name: Check the release file set
        working-directory: ${{ runner.temp }}/dist
        env:
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          expected=("*_universal.dmg" "*_x64-setup.exe" "*.AppImage" "*.deb"
            "powerz-$VERSION-macos-universal.tar.gz" "powerz-$VERSION-linux-x86_64.tar.gz"
            "powerz-$VERSION-windows-x86_64.zip")
          if [ "$PRERELEASE" != "true" ]; then expected+=("*.msi"); fi
          bad=0
          for pattern in "${expected[@]}"; do
            n=$(compgen -G "$pattern" | wc -l || true)
            if [ "$n" -ne 1 ]; then
              echo "expected exactly one $pattern, found $n" >&2
              bad=1
            fi
          done
          total=$(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt | wc -l)
          if [ "$total" -ne "${#expected[@]}" ]; then
            echo "expected ${#expected[@]} files, found $total:" >&2
            ls -l >&2
            bad=1
          fi
          exit "$bad"

      - name: Write SHA256SUMS.txt
        run: |
          cd "$RUNNER_TEMP/dist"
          rm -f SHA256SUMS.txt
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -l

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 14

  # Creates the GitHub Release: titled with the version and codename, notes from the
  # CHANGELOG section, marked as a pre-release for a tag with a pre-release suffix.
  publish:
    name: publish
    needs: [check, desktop, cli, assemble]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: ${{ runner.temp }}/dist

      # The files to attach, SHA256SUMS.txt included, must match their checksums.
      - name: Verify SHA256SUMS.txt
        working-directory: ${{ runner.temp }}/dist
        run: sha256sum --check --strict SHA256SUMS.txt

      # The release scripts from the commit this run was started from: the tag on a
      # tag push, the dispatched branch on a manual run (an older tag may not carry
      # publish.ts).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: apps/desktop/scripts/release

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # The release stays a draft until every file is attached, so a failed
      # step never leaves a half-filled published release. A re-run for the
      # same tag reuses the release and replaces its files. publish.ts keeps the
      # id of the release it created or found and never looks a new draft up again.
      # Only this step gets the write token.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
          TITLE: ${{ needs.check.outputs.title }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          bun apps/desktop/scripts/release/publish.ts \
            --notes "$RUNNER_TEMP/notes/release-notes.md" "$RUNNER_TEMP"/dist/*
