[package]
name = "powerz-protocol"
description = "Unofficial protocol library for the ChargerLAB POWER-Z KM003C / KM002C USB-C power meter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["usb-c", "usb-pd", "power-meter", "km003c", "power-z"]
categories = ["hardware-support"]

[features]
default = ["hid"]
hid = ["dep:hidapi"]

[dependencies]
aes = "0.8.4"
crc32fast = "1.5.3"
getrandom = "0.4.3"
hidapi = { version = "2.6.7", optional = true }
nusb = "0.2.8"
serialport = "4.10.1"
thiserror = "2"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
sha2 = "0.11.1"
