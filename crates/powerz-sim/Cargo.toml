[package]
name = "powerz-sim"
description = "Simulated POWER-Z KM003C (demo device and e2e test double) behind the powerz-protocol Transport trait"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Featureless (FR QFTCWX), so the simulator builds for wasm32-unknown-unknown.
powerz-protocol.workspace = true

# Off the web, the native transports: the HID persona as a raw HID device,
# the bootloader flash pipe and the USB identity.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
powerz-protocol = { workspace = true, features = ["bulk", "hid", "cdc"] }

[lints]
workspace = true

[dev-dependencies]
sha2 = "0.11.1"
