[package]
name = "powerz-wasm"
description = "WebAssembly binding (sans-IO) over the POWER-Z protocol core and simulator for the web edition"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Featureless (FR QFTCWX): no native transport in the web module.
powerz-protocol.workspace = true
# The desktop backup file name and CSV (FR W8SHXA).
powerz-record.workspace = true
powerz-sim.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
# The build:wasm script pins wasm-bindgen-cli to this exact version.
wasm-bindgen = "=0.2.129"

[dev-dependencies]
serde_json = "1.0.154"

[lints]
workspace = true
