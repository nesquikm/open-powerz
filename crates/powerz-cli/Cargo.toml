[package]
name = "powerz-cli"
description = "Command-line tool for the ChargerLAB POWER-Z KM003C / KM002C (unofficial)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "powerz"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
powerz-protocol.workspace = true
powerz-sim.workspace = true
serde_json = "1.0.154"

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
csv = "1.4.0"
insta = "1.49.0"
predicates = "3.1.4"
