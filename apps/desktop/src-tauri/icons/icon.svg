<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1330"/>
      <stop offset="1" stop-color="#121d48"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#b8c4d6"/>
    </linearGradient>
    <clipPath id="display">
      <rect x="220" y="376" width="584" height="272" rx="136"/>
    </clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>
  <!-- USB-C receptacle, drawn as the meter's display -->
  <rect x="196" y="352" width="632" height="320" rx="160" fill="url(#screen)"/>
  <g clip-path="url(#display)" stroke="#3b5bdb" stroke-opacity="0.35" stroke-width="4">
    <path d="M200 444 H824 M200 512 H824 M200 580 H824"/>
    <path d="M340 360 V664 M456 360 V664 M572 360 V664 M688 360 V664"/>
  </g>
  <g filter="url(#glow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- current: rises with the load and settles -->
    <path d="M300 598 H436 C466 598 474 546 508 546 C548 546 568 560 610 557 C650 554 690 550 730 550" stroke="#5eead4" stroke-width="26"/>
    <!-- voltage: a step with a damped overshoot -->
    <path d="M300 572 H432 C448 572 450 444 478 438 C504 432 510 466 532 464 C554 462 562 454 586 454 H730" stroke="#facc15" stroke-width="42"/>
  </g>
  <rect x="196" y="352" width="632" height="320" rx="160" fill="none" stroke="url(#shell)" stroke-width="48"/>
</svg>
