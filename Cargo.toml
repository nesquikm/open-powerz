[workspace]
resolver = "3"
members = [
    "crates/powerz-pd",
    "crates/powerz-protocol",
    "crates/powerz-sim",
    "crates/powerz-record",
    "crates/powerz-cli",
    "apps/desktop/src-tauri",
]
default-members = ["crates/powerz-pd", "crates/powerz-protocol", "crates/powerz-sim", "crates/powerz-record", "crates/powerz-cli"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/nesquikm/open-powerz"
authors = ["Mikhail Drapoliuk"]

[workspace.dependencies]
powerz-pd = { path = "crates/powerz-pd", version = "0.6.0" }
powerz-protocol = { path = "crates/powerz-protocol", version = "0.6.0" }
powerz-sim = { path = "crates/powerz-sim", version = "0.6.0" }
powerz-record = { path = "crates/powerz-record", version = "0.6.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
