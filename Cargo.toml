[workspace]
resolver = "3"
members = ["crates/powerz-protocol", "crates/powerz-cli", "apps/desktop/src-tauri"]
default-members = ["crates/powerz-protocol", "crates/powerz-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/nesquikm/open-powerz"
authors = ["Mikhail Drapoliuk"]

[workspace.dependencies]
powerz-protocol = { path = "crates/powerz-protocol", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
