<?xml version="1.0" encoding="UTF-8"?>
<!-- open-powerz startup logo candidate 3: "electron surf". Original art, MIT. Alpha mode, 200x200. -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <symbol id="g-e" overflow="visible"><path d="M1,5 H9.5 A4.5,4.5 0 1,0 8.2,8.2" fill="none"/></symbol>
    <path id="spark" d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z"/>
    <clipPath id="sea"><path d="M-12.5,130 C12.5,165 37.5,165 62.5,130 C87.5,95 112.5,95 137.5,130 C162.5,165 187.5,165 212.5,130 L212.5,205 L-12.5,205 Z"/></clipPath>
  </defs>

  <g stroke="#111" stroke-linejoin="round" stroke-linecap="round">
    <!-- stars -->
    <use href="#spark" transform="translate(26,30)" fill="#fff" stroke-width="2.5"/>
    <use href="#spark" transform="translate(170,22) scale(0.7)" fill="#ffd23f" stroke-width="3"/>
    <use href="#spark" transform="translate(178,92) scale(0.6)" fill="#3ff0ff" stroke-width="3"/>

    <!-- the sine wave sea -->
    <path d="M-12.5,130 C12.5,165 37.5,165 62.5,130 C87.5,95 112.5,95 137.5,130 C162.5,165 187.5,165 212.5,130 L212.5,205 L-12.5,205 Z" fill="#2f6bff" stroke-width="6"/>
    <g clip-path="url(#sea)" fill="none">
      <path d="M-12.5,150 C12.5,185 37.5,185 62.5,150 C87.5,115 112.5,115 137.5,150 C162.5,185 187.5,185 212.5,150" stroke="#7fd4ff" stroke-width="6"/>
      <path d="M-12.5,174 C12.5,209 37.5,209 62.5,174 C87.5,139 112.5,139 137.5,174 C162.5,209 187.5,209 212.5,174" stroke="#1d47c9" stroke-width="10"/>
    </g>
    <!-- foam on the crest -->
    <path d="M70,121 C88,99 112,99 130,121" fill="none" stroke="#fff" stroke-width="5"/>
    <circle cx="146" cy="110" r="4" fill="#fff" stroke-width="2.5"/>
    <circle cx="156" cy="100" r="3" fill="#fff" stroke-width="2.5"/>
    <circle cx="150" cy="92" r="2.2" fill="#fff" stroke-width="2"/>

    <!-- board -->
    <ellipse cx="100" cy="102" rx="40" ry="8" transform="rotate(-8,100,102)" fill="#ff5ca8" stroke-width="5"/>
    <path d="M66,106 L134,96" stroke="#fff" stroke-width="2.5"/>

    <!-- legs + arms out for balance -->
    <path d="M92,80 L88,101 M108,80 L113,98" stroke-width="6"/>
    <path d="M80,62 L58,52 M120,62 L144,56" stroke-width="6"/>
    <circle cx="56" cy="51" r="6" fill="#ffd23f" stroke-width="4"/>
    <circle cx="146" cy="55" r="6" fill="#ffd23f" stroke-width="4"/>

    <!-- the electron -->
    <circle cx="100" cy="62" r="25" fill="#ffd23f" stroke-width="6"/>
    <!-- shades -->
    <path d="M80,55 H120" stroke-width="4"/>
    <rect x="81" y="53" width="16" height="11" rx="5" fill="#111" stroke-width="2"/>
    <rect x="103" y="53" width="16" height="11" rx="5" fill="#111" stroke-width="2"/>
    <path d="M85,56 L89,56 M107,56 L111,56" stroke="#7fd4ff" stroke-width="2"/>
    <!-- grin -->
    <path d="M88,72 Q100,84 112,72" fill="none" stroke-width="4"/>

    <!-- e- tag above the head -->
    <g transform="translate(86,14) scale(1.6)" fill="none">
      <use href="#g-e" stroke="#111" stroke-width="5"/>
      <use href="#g-e" stroke="#3ff0ff" stroke-width="3"/>
      <path d="M13,1 H19" stroke="#111" stroke-width="5"/>
      <path d="M13,1 H19" stroke="#3ff0ff" stroke-width="3"/>
    </g>
  </g>
</svg>
